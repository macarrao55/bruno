{% extends 'base.html' %}
{% block content %}
<div class="grid-3">
<div class="card"><h3>Caixa</h3><form method="post" action="{{url_for('financeiro_cash')}}"><input type="hidden" name="action" value="abrir"><input name="amount" placeholder="Valor abertura"><button class="btn">Abrir</button></form><form method="post" action="{{url_for('financeiro_cash')}}"><input type="hidden" name="action" value="fechar"><input name="amount" placeholder="Valor fechamento"><button class="btn danger" onclick="return confirm('Fechar caixa?')">Fechar</button></form></div>
<div class="card"><h3>Sangria/Suprimento</h3><form method="post" action="{{url_for('financeiro_cash')}}"><select name="action"><option value="sangria">Sangria</option><option value="suprimento">Suprimento</option></select><input name="amount" type="number" step="0.01"><input name="note"><button class="btn">Lançar</button></form></div>
<div class="card"><h3>Lucro Estimado</h3><p>R$ {{'%.2f'|format(lucro)}}</p></div>
</div>
<div class="card"><h3>Despesas</h3><form method="post" action="{{url_for('financeiro_despesa')}}"><input name="description" required><input name="amount" type="number" step="0.01" required><button class="btn">Adicionar</button></form></div>
<div class="card table-wrap"><table><tr><th>Forma</th><th>Total</th></tr>{% for p in by_payment %}<tr><td>{{p['payment_method']}}</td><td>R$ {{'%.2f'|format(p['total'])}}</td></tr>{% endfor %}</table></div>
{% endblock %}
